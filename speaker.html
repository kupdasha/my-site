<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профиль спикера — Дарья Купцова</title>
<link rel="stylesheet" href="style.css">

  "alternateName": ["Даша Купцова", "Купяша"],
  "url": "https://kupdasha.ru/profile",
  "image": "https://static.tildacdn.com/tild3963-6534-4061-a466-353764656535/IMG_2571.JPG",

  "email": "mailto:kupdaria@yandex.ru",
  "knowsAbout": ["ИИ в дизайн-продакшене", "креативное лидерство", "коммуникационный дизайн", "брендинг", "нейросети в дизайне", "арт-дирекшн"],

<!-- одна версия: из дружеской остаются черный фон и белый текст -->
<script>try{var r=document.documentElement;r.dataset.ink=localStorage.getItem('kd-mode')==='dark'?'black':'white';r.dataset.theme='light'}catch(e){}</script>
</head>
<body class="page-speaker">
<!--
  КАРКАС СТРАНИЦЫ
  Тексты — в content.js (SITE.speaker), живые блоки — speaker.js, оформление — speaker.css.
-->

<!-- Шапка -->
<header class="head" id="head">
  <div class="wrap">
    <a class="logo" href="index.html" data-text="name"></a>
    <nav class="nav" id="nav"></nav>
  </div>
</header>

<main>
  <!-- Профиль спикера -->
  <section class="sp-hero" id="speaker">
    <div class="wrap">
      <!-- верх: имя и темы слева, фото справа; низ под чертой: кто я — слева, подкаст и жюри — справа -->
      <div class="sp-top">
        <h1 class="sp-title" data-reveal data-text="speaker.title"></h1>
        <div class="sp-photo" id="spPhoto" data-reveal></div>
      </div>
      <div class="sp-intro" data-reveal>
        <p class="sp-lead" data-text="speaker.lead"></p>
        <div class="sp-side">
          <p class="sp-lead" data-text="speaker.podcast"></p>
          <p class="sp-lead" data-text="speaker.jury"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Темы докладов -->
  <section class="sp-sec" id="topics">
    <div class="wrap">
      <h2 class="h2 sp-h2" data-reveal data-text="speaker.topicsTitle"></h2>
      <div class="sp-topics" id="topicList"></div>
    </div>
  </section>

  <!-- Где уже была спикером: события и роли в две колонки, жюри, ссылка на записи -->
  <section class="sp-sec" id="talks">
    <div class="wrap">
      <h2 class="h2 sp-h2" data-reveal data-text="speaker.talksTitle"></h2>
      <div class="sp-talks" id="talkList"></div>
      <div class="ctas sp-talks-btn" data-reveal><a class="btn btn-line" data-href="speaker.talksLink"><span data-text="speaker.talksButton"></span><span class="arr">→</span></a></div>
    </div>
  </section>

  <!-- Для анонса: био разной длины и фотографии -->
  <section class="sp-band" id="bio">
    <div class="wrap sp-bio">
      <div class="sp-bio-side">
        <h2 class="h2" data-reveal data-text="speaker.bioTitle"></h2>
        <p class="sp-note" data-reveal data-text="speaker.bioNote"></p>
        <div class="ctas sp-photos-btn" data-reveal><a class="btn btn-line" data-href="speaker.photosLink"><span data-text="speaker.photosButton"></span><span class="arr">↓</span></a></div>
      </div>
      <div class="sp-bio-main" id="bioBox" data-reveal></div>
    </div>
  </section>

  <!-- Организую мероприятия: текст и сайты событий -->
  <section class="sp-sec" id="org">
    <div class="wrap sp-bio">
      <h2 class="h2" data-reveal data-text="speaker.orgTitle"></h2>
      <div data-reveal>
        <p class="sp-org-text" data-text="speaker.orgText"></p>
      </div>
    </div>
    <div class="wrap"><div class="sp-shows" id="showList"></div></div>
  </section>

  <!-- Контакт -->
  <section class="contact" id="contact">
    <div class="wrap">
      <h2 class="h2 center" data-reveal data-text="speaker.contactTitle"></h2>
      <p class="lead" data-reveal data-text="speaker.contactLead"></p>
      <div class="ctas contact-links" id="contactLinks" data-reveal></div>
      <p class="sp-mail" data-reveal><a class="link" id="speakerMail"><span id="speakerMailText"></span></a></p>
      <footer class="foot">
        <span data-text="footer.left"></span>
      </footer>
    </div>
  </section>
</main>

<!-- Кнопка «Связаться», всегда на экране -->
<!-- Маленькая кнопка «наверх» -->
<button class="to-top" id="toTop" aria-label="Наверх"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
