<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Позвать спикером — Дарья Купцова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- версия (светлая или темная) выставляется сразу, чтобы страница не мигала -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem('kd-mode')||'light'}catch(e){}</script>
</head>
<body class="page-speaker">
<!--
  КАРКАС СТРАНИЦЫ
  Тексты здесь не пишутся: атрибут data-text="hero.title" значит
  «взять текст hero.title из content.js». Править тексты — в content.js,
  оформление — в style.css.
-->

<!-- Шапка -->
<header class="head" id="head">
  <div class="wrap">
    <a class="logo" href="index.html" data-text="name"></a>
    <nav class="nav" id="nav"></nav>
    <button class="switch" id="switch" role="switch" aria-checked="false" aria-label="Переключить версию сайта">
      <span data-text="switchLeft"></span><i></i><span data-text="switchRight"></span>
      <b class="switch-hint" data-text="switchHint" aria-hidden="true"></b>
    </button>
  </div>
</header>

<main>
  <!-- Позвать спикером -->
  <section class="about-page speaker" id="speaker">
    <div class="wrap">
      <h1 class="h1 split" data-text="speaker.title"></h1>
      <div class="about">
        <div class="portrait" data-reveal><img id="speakerPhoto" alt="Дарья Купцова на сцене" loading="lazy"></div>
        <div>
          <p class="big" data-reveal data-text="speaker.lead"></p>
          <p class="txt" data-reveal data-text="speaker.podcast"></p>
          <div class="ctas about-cta" data-reveal>
            <a class="btn btn-accent" data-href="telegram"><span data-text="contactButton"></span><span class="arr">→</span></a>
            <a class="btn btn-line" id="speakerMail"><span id="speakerMailText"></span></a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Темы выступлений -->
  <section class="sec" id="topics">
    <div class="wrap">
      <div class="sec-head"><h2 class="h2" data-reveal data-text="speaker.topicsTitle"></h2></div>
      <div class="topics" id="topicList"></div>
    </div>
  </section>

  <!-- Био разной длины -->
  <section class="sec" id="bio">
    <div class="wrap">
      <div class="sec-head"><h2 class="h2" data-reveal data-text="speaker.bioTitle"></h2></div>
      <div class="topics" id="bioList"></div>
    </div>
  </section>

  <!-- Записи выступлений -->
  <section class="sec" id="shows">
    <div class="wrap">
      <div class="sec-head"><h2 class="h2" data-reveal data-text="speaker.showsTitle"></h2></div>
      <div id="showList"></div>
      <div class="channel" data-reveal>
        <p class="lead" data-text="speaker.photosText"></p>
        <div class="ctas"><a class="btn btn-line" data-href="speaker.photosLink"><span data-text="speaker.photosButton"></span><span class="arr">↓</span></a></div>
      </div>
    </div>
  </section>

  <!-- Контакт -->
  <section class="contact" id="contact">
    <div class="wrap">
      <h2 class="h2 center" data-reveal data-text="contact.title"></h2>
      <p class="lead" data-reveal data-text="contact.lead"></p>
      <div class="ctas contact-links" id="contactLinks" data-reveal></div>
      <div class="ttt" id="ttt" data-reveal></div>
      <footer class="foot">
        <span data-text="footer.left"></span>
      </footer>
    </div>
  </section>
</main>

<!-- Кнопка «Связаться», всегда на экране -->
<!-- Маленькая кнопка «наверх» -->
<button class="to-top" id="toTop" aria-label="Наверх"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button>
<a class="fab tease" id="fab" data-href="telegram"><span data-text="contactButton" class="spell"></span></a>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="content.js"></script>
<script src="app.js"></script>
<script src="waves.js"></script>
<script src="fun.js"></script>
</body>
</html>
