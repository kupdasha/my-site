<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<body>
<div id="allrecords" class="t-records">
<div class="r t-rec" data-record-type="131"><!-- 1 шапка / 1 оформление -->
<!-- ОФОРМЛЕНИЕ САЙТА: шрифты и стили. Это код, тексты здесь не правятся. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<div class="r t-rec" data-record-type="131"><!-- 1 шапка / 2 шапка и общие тексты -->
<!-- Шапка -->
<header class="head" id="head">
  <div class="wrap">
    <span class="logo" data-text="name"></span>
    <nav class="nav" id="nav"></nav>
    <button class="switch" id="switch" role="switch" aria-checked="false" aria-label="Переключить версию сайта">
      <span data-text="switchLeft"></span><i></i><span data-text="switchRight"></span>
      <b class="switch-hint" data-text="switchHint" aria-hidden="true"></b>
    </button>
  </div>
</header>

<!-- ТЕКСТЫ И ПРОЕКТЫ сайта лежат на GitHub в content.js и подключаются отсюда. -->
<script>(function(){var B='../',v=Math.floor(Date.now()/36e5);document.write('<script src="'+B+'content.js?v='+v+'"><\/script>')})()</script>
</div>
<div class="r t-rec" data-record-type="131"><!-- 2 главная / 1 первый экран -->
<!-- Первый экран -->
  <section class="hero" id="hero">
    <canvas id="dots" aria-hidden="true"></canvas>
    <div class="wrap">
      <div class="eyebrow" data-reveal data-text="hero.eyebrow"></div>
      <h1 class="h1 split" data-text="hero.title"></h1>
      <p class="hero-sub" data-reveal style="--d:.25s" data-text="hero.subtitle"></p>
      <div class="hero-row">
        <p class="lead" data-reveal style="--d:.35s" data-text="hero.lead"></p>
        <div class="ctas" data-reveal style="--d:.5s">
          <a class="btn btn-accent tease" data-href="telegram"><span data-text="hero.button"></span><span class="arr">→</span></a>
          <a class="link hero-link" href="#works" data-text="hero.button2"></a>
        </div>
      </div>
    </div>
  </section>
</div>
<div class="r t-rec" data-record-type="131"><!-- 2 главная / 2 направления -->
<!-- Направления -->
  <section class="sec" id="directions">
    <div class="wrap">
      <div class="sec-head">
        <h2 class="h2" data-reveal data-text="directions.title"></h2>
        <p class="sec-note" data-reveal data-text="directions.note"></p>
      </div>
      <div class="dirs" id="dirList"></div>
    </div>
  </section>
</div>
<div class="r t-rec" data-record-type="131"><!-- 2 главная / 3 проекты -->
<!-- Проекты -->
  <section class="sec" id="works">
    <div class="wrap">
      <div class="sec-head">
        <h2 class="h2" data-reveal data-text="works.title"></h2>
        <p class="sec-note" data-reveal data-text="works.note"></p>
      </div>
      <div class="chips" id="workFilters" data-reveal></div>
      <div class="works" id="workList"></div>
      <!-- Другие работы: проекты с other: true в content.js -->
      <div class="other-works" id="otherWorks">
        <h3 class="other-title" data-reveal data-text="works.otherTitle"></h3>
        <div class="articles" id="otherList"></div>
      </div>
      <!-- те же фильтры еще раз: нажатие возвращает к началу проектов -->
      <div class="chips chips-end" id="workFiltersEnd" data-reveal></div>
    </div>
  </section>
</div>
<div class="r t-rec" data-record-type="131"><!-- 2 главная / 4 проекты под NDA -->
<!-- Проекты под NDA -->
  <section class="sec" id="nda">
    <div class="wrap">
      <div class="sec-head">
        <h2 class="h2" data-reveal data-text="nda.title"></h2>
        <p class="sec-note" data-reveal data-text="nda.note"></p>
      </div>
      <div class="nda" id="ndaList"></div>
      <!-- закрытые карточки под градиентом: дальше — только по паролю -->
      <div class="nda nda-more" id="ndaMore"></div>
      <div class="ctas nda-cta" data-reveal><a class="btn btn-accent" data-href="telegram"><span data-text="nda.button"></span><span class="arr">→</span></a><a class="btn btn-line" data-href="nda.link"><span data-text="nda.button2"></span><span class="arr">→</span></a></div>
    </div>
  </section>
</div>
<div class="r t-rec" data-record-type="131"><!-- 2 главная / 5 контакт -->
<!-- Контакт -->
  <section class="contact" id="contact">
    <div class="wrap">
      <!-- Конец страницы: написать или переключиться на дружескую версию.
           Тумблер справа работает как в шапке и возвращает в начало страницы -->
      <div class="ty" data-reveal>
        <h2 class="h2" data-text="contact.title"></h2>
        <p class="lead" data-text="contact.lead"></p>
        <div class="ty-row">
          <div class="ctas contact-links" id="contactLinks"></div>
        </div>
        <!-- радужный перелив только под тумблером -->
        <div class="ty-switch" data-waves data-colors="#E2FB5A,#B9F5C8,#BCD6FE,#E3D2FD" data-speed=".8">
          <button class="switch switch-big" role="switch" aria-checked="false" aria-label="Переключить версию сайта">
            <span data-text="contact.switch"></span><i></i>
          </button>
        </div>
      </div>
      <div class="ttt" id="ttt" data-reveal></div>
      <footer class="foot">
        <span data-text="footer.left"></span>
      </footer>
    </div>
  </section>
</div>
<div class="r t-rec" data-record-type="131"><!-- 4 страница NDA / 1 страница NDA целиком -->
<!-- ОФОРМЛЕНИЕ САЙТА: шрифты и стили. Это код, тексты здесь не правятся. -->

<!-- Шапка -->
<header class="head" id="head">
  <div class="wrap">
    <span class="logo" data-text="name"></span>
    <nav class="nav" id="nav"></nav>
    <button class="switch" id="switch" role="switch" aria-checked="false" aria-label="Переключить версию сайта">

<!-- ТЕКСТЫ И ПРОЕКТЫ сайта лежат на GitHub в content.js и подключаются отсюда. -->
<script>(function(){var B='../',v=Math.floor(Date.now()/36e5);document.write('<script src="'+B+'content.js?v='+v+'"><\/script>')})()</script>

<!-- Проекты под NDA: карточки сеткой, каждая открывает кейс. Тексты и проекты — в ndaPage (content.js) -->
  <section class="nda-page" id="ndaPage" data-page="nda">
    <div class="wrap case-head">
      <h1 class="case-title split" data-text="ndaPage.title"></h1>
      <p class="case-sub" data-reveal data-text="ndaPage.lead"></p>
    </div>
    <div class="wrap">
      <div class="works" id="ndaProjects"></div>
    </div>
  </section>

<!-- Кнопки «связаться» и «наверх», окно кейса, сообщения -->
<!-- Кнопка «Связаться», всегда на экране -->
<!-- Маленькая кнопка «наверх» -->
<button class="to-top" id="toTop" aria-label="Наверх"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button>
<a class="fab tease" id="fab" data-href="telegram"><span data-text="contactButton" class="spell"></span></a>

<!-- Страница кейса: заполняется при клике на карточку -->
<div class="case" id="case" role="dialog" aria-modal="true" aria-labelledby="caseTitle">
  <div class="case-bar"><div class="wrap">
    <button class="case-back" id="caseBack">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 10H4M9 5l-5 5 5 5"/></svg>
      <span data-text="ndaPage.back"></span>
    </button>
  </div></div>
  <div id="caseContent"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- КОД САЙТА. Это код, тексты здесь не правятся: сам код лежит на GitHub. -->
<script>(function(){var B='../',v=Math.floor(Date.now()/36e5),L=window.KUP_LOADED=window.KUP_LOADED||{};['app.js','waves.js','fun.js','shimmer.js'].forEach(function(f){if(L[f])return;L[f]=1;document.write('<script src="'+B+f+'?v='+v+'"><\/script>')})})()</script>
</div>
<div class="r t-rec" data-record-type="131"><!-- 5 таплинк / 1 таплинк целиком -->
<!-- ТАПЛИНК. Весь таплинк лежит на GitHub в taplink.html и подключается отсюда. Блок не менять. -->
<div id="taplink-root" style="min-height:100vh;background:#FFFFFF"></div>
<script>(function(){var B='../',v=Math.floor(Date.now()/36e5),root=document.getElementById('taplink-root');
try{if(localStorage.getItem('tl-mode')==='fun')root.style.background='#0E0F12'}catch(e){}
var G='https://raw.githubusercontent.com/kupdasha/my-site/main/taplink.html';
function get(u,ms){return new Promise(function(ok,no){var t=setTimeout(no,ms);fetch(u).then(function(r){clearTimeout(t);r.ok?r.text().then(ok,no):no()},no)})}
get(G+'?v='+Math.floor(Date.now()/6e4),4000).catch(function(){return get(B+'taplink.html?v='+v,15000)}).then(function(html){
var doc=new DOMParser().parseFromString(html,'text/html');
[].slice.call(doc.querySelectorAll('head link, head style, body > link, body > style')).forEach(function(n){document.head.appendChild(n)});
[].slice.call(doc.body.childNodes).forEach(function(n){root.appendChild(n)});
[].slice.call(root.querySelectorAll('script')).forEach(function(s){var x=document.createElement('script');x.textContent=s.textContent;s.parentNode.replaceChild(x,s)});
root.style.minHeight='';root.style.background=''})})()</script>
</div>

</div>
