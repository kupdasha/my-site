<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проекты под NDA — Дарья Купцова</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- версия (светлая или темная) выставляется сразу, чтобы страница не мигала -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem('kd-mode')||'light'}catch(e){}</script>
</head>
<body class="page-nda">
<!--
  КАРКАС СТРАНИЦЫ
  Тексты здесь не пишутся: атрибут data-text="hero.title" значит
  «взять текст hero.title из content.js». Править тексты — в content.js,
  оформление — в style.css.
-->

<!-- Шапка -->
<header class="head" id="head">
  <div class="wrap">
    <a class="logo" href="index.html" data-text="name"></a>
    <nav class="nav" id="nav"></nav>
    <button class="switch" id="switch" role="switch" aria-checked="false" aria-label="Переключить версию сайта">
      <span data-text="switchLeft"></span><i></i><span data-text="switchRight"></span>
      <b class="switch-hint" data-text="switchHint" aria-hidden="true"></b>
    </button>
  </div>
</header>

<main>
  <!-- Проекты под NDA: карточки сеткой, каждая открывает кейс. Тексты и проекты — в ndaPage (content.js) -->
  <section class="nda-page" id="ndaPage" data-page="nda">
    <div class="wrap case-head">
      <h1 class="case-title split" data-text="ndaPage.title"></h1>
      <p class="case-sub" data-reveal data-text="ndaPage.lead"></p>
    </div>
    <div class="wrap">
      <div class="works" id="ndaProjects"></div>
    </div>
  </section>

  <!-- Контакт -->
  <section class="contact" id="contact">
    <div class="wrap">
      <h2 class="h2 center" data-reveal data-text="contact.title"></h2>
      <p class="lead" data-reveal data-text="contact.lead"></p>
      <div class="ctas contact-links" id="contactLinks" data-reveal></div>
      <div class="ttt" id="ttt" data-reveal></div>
      <footer class="foot">
        <span data-text="footer.left"></span>
      </footer>
    </div>
  </section>
</main>

<!-- Кнопка «Связаться», всегда на экране -->
<!-- Маленькая кнопка «наверх» -->
<button class="to-top" id="toTop" aria-label="Наверх"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button>
<a class="fab tease" id="fab" data-href="telegram"><span data-text="contactButton" class="spell"></span></a>

<!-- Страница кейса: заполняется при клике на карточку -->
<div class="case" id="case" role="dialog" aria-modal="true" aria-labelledby="caseTitle">
  <div class="case-bar"><div class="wrap">
    <button class="case-back" id="caseBack">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 10H4M9 5l-5 5 5 5"/></svg>
      <span data-text="ndaPage.back"></span>
    </button>
  </div></div>
  <div id="caseContent"></div>
</div>
<!-- Кейс открыт по ссылке (#case-N): пока грузятся тексты и код, сразу видна страница-скелет -->
<script>(function(){if(!/^#case-\d+$/.test(location.hash))return;var c=document.getElementById('case'),b=document.getElementById('caseContent');if(!c||!b||b.firstChild)return;c.classList.add('open','boot');document.documentElement.classList.add('case-boot');var l='';for(var i=0;i<4;i++)l+='<i class="sk sk-l"></i>';b.innerHTML='<div class="case-skel" aria-hidden="true"><div class="wrap case-head"><i class="sk sk-t"></i><i class="sk sk-t sk-t2"></i></div><i class="sk sk-hero"></i><div class="wrap sk-body"><div class="sk-col"><i class="sk sk-l sk-s"></i></div><div class="sk-col">'+l+'</div></div></div>'})()</script>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="content.js"></script>
<script src="app.js"></script>
<script src="waves.js"></script>
<script src="fun.js"></script>
</body>
</html>
